<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Konseptfigurer steg for steg</title>
<meta name="description" content="Presentasjonssekvenser fra ssb-konseptfigurer: spørsmål, konsept, oversikt og fokus.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root { --blekk: #1e3a3f; --mork: #274246; --graa: #5e787a; --linje: #cdd3d4; --bakgrunn: #eef3f3; --lilla: #7d5fea; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bakgrunn); color: var(--blekk); font-family: "Open Sans", "Segoe UI", Arial, sans-serif; line-height: 1.5; }
  main { max-width: 980px; margin: 0 auto; padding: 40px 16px; }
  h1 { font-size: clamp(1.5rem, 3vw, 2.1rem); margin: 0 0 8px; line-height: 1.2; }
  .ingress { margin: 0 0 28px; color: var(--mork); max-width: 62ch; }
  .rekke { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 32px; padding: 0; list-style: none; font-size: .88rem; font-weight: 700; }
  .rekke li { background: #fff; border: 1.5px solid var(--linje); border-radius: 999px; padding: 4px 12px; }
  .rekke li:not(:last-child)::after { content: " →"; color: var(--graa); }
  .kort { display: grid; gap: 6px; background: #fff; border: 1px solid #d9e2e2; border-radius: 12px; padding: 20px 22px; color: inherit; text-decoration: none; margin-bottom: 14px; }
  .kort:hover { border-color: var(--mork); }
  .kort:focus-visible { outline: 3px solid var(--lilla); outline-offset: 2px; }
  .kort strong { font-size: 1.2rem; }
  .serie, .steg { font-size: .82rem; color: var(--graa); font-weight: 700; }
  .serie { text-transform: uppercase; letter-spacing: .04em; }
</style>
</head>
<body>
<main>
  <h1>Konseptfigurer, steg for steg</h1>
  <p class="ingress">Tette oversiktsfigurer vist i fire trinn. Alle bildene bruker samme geometri, slik at det som er felles blir stående og bare det som er nytt kommer til. Metoden er til utprøving.</p>
  <ol class="rekke"><li>Spørsmål</li><li>Konsept</li><li>Oversikt</li><li>Fokus</li></ol>
  {{KORT}}
</main>
</body>
</html>
