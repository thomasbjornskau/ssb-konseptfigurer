<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
<rect x="0" y="0" width="1920" height="1080" fill="#ffffff"/>
<text x="60" y="92" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="46" font-weight="700" fill="#1e3a3f" text-anchor="start">KI-assistent som veiviser, ikke fri svarmaskin</text>
<text x="60" y="136" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="24" font-weight="400" fill="#5e787a" text-anchor="start">Hva en SSB-assistent bør kunne, hva den ikke skal gjøre, og hva den forutsetter</text>
<rect x="1690" y="62" width="170" height="40" rx="20" fill="#ffffff" stroke="#274246" stroke-width="2"/>
<text x="1775.0" y="89" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#274246" text-anchor="middle">Diskusjon</text>
<line x1="60" y1="160" x2="1860" y2="160" stroke="#cdd3d4" stroke-width="2"/>
<rect x="1440" y="180" width="420" height="806" rx="16" fill="#eff8fa" stroke="#eff8fa" stroke-width="0"/>
<text x="1466" y="226" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="25" font-weight="700" fill="#1e3a3f" text-anchor="start">Slik leses figuren</text>
<circle cx="1485" cy="268" r="19" fill="#1e3a3f" stroke="#ffffff" stroke-width="3"/>
<text x="1485" y="276" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
<text x="1516" y="276" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#1e3a3f" text-anchor="start">Veiviser, ikke orakel</text>
<text x="1516" y="303" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#274246" text-anchor="start">Assistenten peker på autoritative</text>
<text x="1516" y="326" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#274246" text-anchor="start">kilder. Den lager ikke egne</text>
<text x="1516" y="349" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#274246" text-anchor="start">sannheter.</text>
<circle cx="1485" cy="388" r="19" fill="#1e3a3f" stroke="#ffffff" stroke-width="3"/>
<text x="1485" y="396" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
<text x="1516" y="396" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#1e3a3f" text-anchor="start">«Jeg vet ikke» er en funksjon</text>
<text x="1516" y="423" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#274246" text-anchor="start">Å avstå eller henvise videre er</text>
<text x="1516" y="446" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#274246" text-anchor="start">riktig oppførsel når kilden</text>
<text x="1516" y="469" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#274246" text-anchor="start">ikke holder.</text>
<circle cx="1485" cy="508" r="19" fill="#1e3a3f" stroke="#ffffff" stroke-width="3"/>
<text x="1485" y="516" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
<text x="1516" y="516" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#1e3a3f" text-anchor="start">Forutsetningene er metadata</text>
<text x="1516" y="543" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#274246" text-anchor="start">Uten maskinlesbare begreper,</text>
<text x="1516" y="566" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#274246" text-anchor="start">metode og forbehold (F3) blir</text>
<text x="1516" y="589" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#274246" text-anchor="start">assistenten en gjetter.</text>
<circle cx="1485" cy="628" r="19" fill="#1e3a3f" stroke="#ffffff" stroke-width="3"/>
<text x="1485" y="636" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
<text x="1516" y="636" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#1e3a3f" text-anchor="start">Alt her er forslag</text>
<text x="1516" y="663" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#274246" text-anchor="start">Ingen assistent er besluttet.</text>
<text x="1516" y="686" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#274246" text-anchor="start">Ansvar og regelverk er uavklart.</text>
<line x1="60" y1="1010" x2="1860" y2="1010" stroke="#cdd3d4" stroke-width="1"/>
<rect x="60" y="1026" width="26" height="24" rx="5" fill="#eff8fa" stroke="#274246" stroke-width="1.8"/>
<text x="96" y="1046" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#274246" text-anchor="start">Skal kunne</text>
<rect x="212.0" y="1026" width="26" height="24" rx="5" fill="#f3f5f5" stroke="#b9c5c6" stroke-width="1.6"/>
<text x="248.0" y="1046" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#274246" text-anchor="start">Skal ikke</text>
<rect x="355.4" y="1028" width="26" height="20" rx="10" fill="#ecfeed" stroke="#00824d" stroke-width="1.5"/>
<text x="391.4" y="1046" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#274246" text-anchor="start">Forutsetter</text>
<rect x="516.0" y="1026" width="26" height="24" rx="5" fill="#ffffff" stroke="#5e787a" stroke-width="1.6" stroke-dasharray="5 4"/>
<text x="552.0" y="1046" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#274246" text-anchor="start">Uavklart</text>
<rect x="650.8" y="1026" width="26" height="24" rx="5" fill="#ffffff" stroke="#7d5fea" stroke-width="2" stroke-dasharray="6 4"/>
<text x="686.8" y="1046" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#274246" text-anchor="start">Forslag</text>
<text x="1860" y="1046" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#5e787a" text-anchor="end">29.09.2026 · Utkast til diskusjon, ikke kvalitetssikret</text>
<rect x="60" y="186" width="325" height="500" rx="12" fill="#eff8fa" stroke="#274246" stroke-width="1.8"/>
<text x="80" y="222" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="21" font-weight="700" fill="#1e3a3f" text-anchor="start">Skal kunne</text>
<rect x="76" y="246" width="293" height="60" rx="8" fill="#ffffff" stroke="#274246" stroke-width="1.3"/>
<text x="90" y="282" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="600" fill="#1e3a3f" text-anchor="start">Finne riktig statistikk</text>
<rect x="76" y="318" width="293" height="60" rx="8" fill="#ffffff" stroke="#274246" stroke-width="1.3"/>
<text x="90" y="354" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="600" fill="#1e3a3f" text-anchor="start">Forklare begreper</text>
<rect x="76" y="390" width="293" height="60" rx="8" fill="#ffffff" stroke="#274246" stroke-width="1.3"/>
<text x="90" y="426" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="600" fill="#1e3a3f" text-anchor="start">Vise kilde og tabell</text>
<rect x="76" y="462" width="293" height="60" rx="8" fill="#ffffff" stroke="#274246" stroke-width="1.3"/>
<text x="90" y="498" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="600" fill="#1e3a3f" text-anchor="start">Peke på metode</text>
<rect x="76" y="534" width="293" height="60" rx="8" fill="#ffffff" stroke="#274246" stroke-width="1.3"/>
<text x="90" y="570" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="600" fill="#1e3a3f" text-anchor="start">Advare mot feil sammenligning</text>
<rect x="76" y="606" width="293" height="60" rx="8" fill="#ffffff" stroke="#274246" stroke-width="1.3"/>
<text x="90" y="632" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="600" fill="#1e3a3f" text-anchor="start">Si fra når den ikke kan svare</text>
<text x="90" y="651" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="600" fill="#1e3a3f" text-anchor="start">trygt</text>
<rect x="398" y="186" width="325" height="500" rx="12" fill="#f3f5f5" stroke="#b9c5c6" stroke-width="1.8"/>
<text x="418" y="222" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="21" font-weight="700" fill="#1e3a3f" text-anchor="start">Skal ikke</text>
<rect x="414" y="246" width="293" height="60" rx="8" fill="#ffffff" stroke="#b9c5c6" stroke-width="1.3"/>
<text x="428" y="272" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="600" fill="#1e3a3f" text-anchor="start">Lage egne beregninger uten</text>
<text x="428" y="291" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="600" fill="#1e3a3f" text-anchor="start">kilde</text>
<rect x="414" y="318" width="293" height="60" rx="8" fill="#ffffff" stroke="#b9c5c6" stroke-width="1.3"/>
<text x="428" y="344" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="600" fill="#1e3a3f" text-anchor="start">Krysse data SSB ikke har</text>
<text x="428" y="363" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="600" fill="#1e3a3f" text-anchor="start">publisert</text>
<rect x="414" y="390" width="293" height="60" rx="8" fill="#ffffff" stroke="#b9c5c6" stroke-width="1.3"/>
<text x="428" y="426" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="600" fill="#1e3a3f" text-anchor="start">Gi politiske tolkninger</text>
<rect x="414" y="462" width="293" height="60" rx="8" fill="#ffffff" stroke="#b9c5c6" stroke-width="1.3"/>
<text x="428" y="488" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="600" fill="#1e3a3f" text-anchor="start">Svare om enkeltpersoner eller</text>
<text x="428" y="507" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="600" fill="#1e3a3f" text-anchor="start">foretak</text>
<rect x="736" y="186" width="325" height="500" rx="12" fill="#ecfeed" stroke="#00824d" stroke-width="1.8"/>
<text x="756" y="222" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="21" font-weight="700" fill="#1e3a3f" text-anchor="start">Forutsetter</text>
<rect x="752" y="246" width="293" height="60" rx="8" fill="#ffffff" stroke="#00824d" stroke-width="1.3"/>
<text x="766" y="272" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="600" fill="#1e3a3f" text-anchor="start">Maskinlesbare begreper og</text>
<text x="766" y="291" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="600" fill="#1e3a3f" text-anchor="start">metode (F3)</text>
<rect x="752" y="318" width="293" height="60" rx="8" fill="#ffffff" stroke="#00824d" stroke-width="1.3"/>
<text x="766" y="344" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="600" fill="#1e3a3f" text-anchor="start">Relasjoner mellom statistikker</text>
<text x="766" y="363" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="600" fill="#1e3a3f" text-anchor="start">(F4)</text>
<rect x="752" y="390" width="293" height="60" rx="8" fill="#ffffff" stroke="#00824d" stroke-width="1.3"/>
<text x="766" y="416" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="600" fill="#1e3a3f" text-anchor="start">Kvalitet og usikkerhet som</text>
<text x="766" y="435" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="600" fill="#1e3a3f" text-anchor="start">data</text>
<rect x="752" y="462" width="293" height="60" rx="8" fill="#ffffff" stroke="#00824d" stroke-width="1.3"/>
<text x="766" y="498" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="600" fill="#1e3a3f" text-anchor="start">Logging og evaluering av svar</text>
<rect x="1074" y="186" width="325" height="500" rx="12" fill="#ffffff" stroke="#5e787a" stroke-width="1.8" stroke-dasharray="5 4"/>
<text x="1094" y="222" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="21" font-weight="700" fill="#5e787a" text-anchor="start">Uavklart</text>
<rect x="1090" y="246" width="293" height="60" rx="8" fill="#ffffff" stroke="#5e787a" stroke-width="1.3" stroke-dasharray="5 4"/>
<text x="1104" y="272" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="600" fill="#5e787a" text-anchor="start">Hvem har ansvaret for feil</text>
<text x="1104" y="291" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="600" fill="#5e787a" text-anchor="start">svar?</text>
<rect x="1090" y="318" width="293" height="60" rx="8" fill="#ffffff" stroke="#5e787a" stroke-width="1.3" stroke-dasharray="5 4"/>
<text x="1104" y="354" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="600" fill="#5e787a" text-anchor="start">Hvilken modell og plattform?</text>
<rect x="1090" y="390" width="293" height="60" rx="8" fill="#ffffff" stroke="#5e787a" stroke-width="1.3" stroke-dasharray="5 4"/>
<text x="1104" y="416" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="600" fill="#5e787a" text-anchor="start">Hvilke krav i KI-forordningen</text>
<text x="1104" y="435" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="600" fill="#5e787a" text-anchor="start">gjelder?</text>
<rect x="1090" y="462" width="293" height="60" rx="8" fill="#ffffff" stroke="#5e787a" stroke-width="1.3" stroke-dasharray="5 4"/>
<text x="1104" y="498" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="600" fill="#5e787a" text-anchor="start">Intern først, eller rett ut?</text>
<text x="60" y="728" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#1e3a3f" text-anchor="start">Når assistenten er usikker: fire mulige svar</text>
<rect x="60" y="748" width="318" height="130" rx="10" fill="#00824d" stroke="#00824d" stroke-width="1.8"/>
<text x="78" y="786" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#ffffff" text-anchor="start">Trygt svar</text>
<text x="78" y="814" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#ffffff" text-anchor="start">kilden finnes og</text>
<text x="78" y="834" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#ffffff" text-anchor="start">begrepet er entydig</text>
<polyline points="380.0,813.0 391.6,813.0" fill="none" stroke="#274246" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<polygon points="398.0,813.0 386.0,818.6 386.0,807.4" fill="#274246"/>
<rect x="400" y="748" width="318" height="130" rx="10" fill="#ecfeed" stroke="#00824d" stroke-width="1.8"/>
<text x="418" y="786" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#1e3a3f" text-anchor="start">Svar med forbehold</text>
<text x="418" y="814" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#1e3a3f" text-anchor="start">kilden finnes, men med</text>
<text x="418" y="834" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#1e3a3f" text-anchor="start">usikkerhet eller brudd</text>
<polyline points="720.0,813.0 731.6,813.0" fill="none" stroke="#274246" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<polygon points="738.0,813.0 726.0,818.6 726.0,807.4" fill="#274246"/>
<rect x="740" y="748" width="318" height="130" rx="10" fill="#eff8fa" stroke="#274246" stroke-width="1.8"/>
<text x="758" y="786" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#1e3a3f" text-anchor="start">Henvis videre</text>
<text x="758" y="814" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#1e3a3f" text-anchor="start">en annen kilde eller</text>
<text x="758" y="834" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#1e3a3f" text-anchor="start">flate er riktig</text>
<polyline points="1060.0,813.0 1071.6,813.0" fill="none" stroke="#274246" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<polygon points="1078.0,813.0 1066.0,818.6 1066.0,807.4" fill="#274246"/>
<rect x="1080" y="748" width="318" height="130" rx="10" fill="#f3f5f5" stroke="#b9c5c6" stroke-width="1.8"/>
<text x="1098" y="786" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#1e3a3f" text-anchor="start">Avstå</text>
<text x="1098" y="814" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#1e3a3f" text-anchor="start">ingen autoritativ kilde,</text>
<text x="1098" y="834" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#1e3a3f" text-anchor="start">eller det krever tolkning</text>
<line x1="60" y1="906" x2="1400" y2="906" stroke="#cdd3d4" stroke-width="4" stroke-linecap="round"/>
<polyline points="1300.0,906.0 1390.4,906.0" fill="none" stroke="#5e787a" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
<polygon points="1400.0,906.0 1382.0,914.4 1382.0,897.6" fill="#5e787a"/>
<text x="60" y="934" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" fill="#5e787a" text-anchor="start">økende usikkerhet i kilden eller spørsmålet →</text>
<text x="60" y="962" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" fill="#274246" text-anchor="start">Alle fire er riktig oppførsel. Feil oppførsel er å gi et trygt svar når kilden ikke holder.</text>
</svg>
