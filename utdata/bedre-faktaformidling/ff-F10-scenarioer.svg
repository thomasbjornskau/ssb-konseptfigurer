<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
<rect x="0" y="0" width="1920" height="1080" fill="#ffffff"/>
<text x="60" y="92" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="46" font-weight="700" fill="#1e3a3f" text-anchor="start">To scenarioer for 2050</text>
<text x="60" y="136" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="24" font-weight="400" fill="#5e787a" text-anchor="start">SSB som dataplattform eller som autoritativ statistikkfaglig institusjon</text>
<rect x="1690" y="62" width="170" height="40" rx="20" fill="#ffffff" stroke="#274246" stroke-width="2"/>
<text x="1775.0" y="89" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#274246" text-anchor="middle">Scenario</text>
<line x1="60" y1="160" x2="1860" y2="160" stroke="#cdd3d4" stroke-width="2"/>
<rect x="1440" y="180" width="420" height="806" rx="16" fill="#eff8fa" stroke="#eff8fa" stroke-width="0"/>
<text x="1466" y="226" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="25" font-weight="700" fill="#1e3a3f" text-anchor="start">Slik leses figuren</text>
<circle cx="1485" cy="268" r="19" fill="#1e3a3f" stroke="#ffffff" stroke-width="3"/>
<text x="1485" y="276" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
<text x="1516" y="276" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#1e3a3f" text-anchor="start">To ytterpunkter</text>
<text x="1516" y="303" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#274246" text-anchor="start">Ikke to planer. Scenarioene</text>
<text x="1516" y="326" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#274246" text-anchor="start">gjør forskjellen synlig, slik at</text>
<text x="1516" y="349" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#274246" text-anchor="start">valgene kan diskuteres.</text>
<circle cx="1485" cy="388" r="19" fill="#1e3a3f" stroke="#ffffff" stroke-width="3"/>
<text x="1485" y="396" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
<text x="1516" y="396" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#1e3a3f" text-anchor="start">Begge gir data</text>
<text x="1516" y="423" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#274246" text-anchor="start">Forskjellen er hva som gjør SSB</text>
<text x="1516" y="446" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#274246" text-anchor="start">uerstattelig når andre også har</text>
<text x="1516" y="469" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#274246" text-anchor="start">data og KI.</text>
<circle cx="1485" cy="508" r="19" fill="#1e3a3f" stroke="#ffffff" stroke-width="3"/>
<text x="1485" y="516" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
<text x="1516" y="516" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#1e3a3f" text-anchor="start">Begge har risiko</text>
<text x="1516" y="543" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#274246" text-anchor="start">Plattformen kan bli én kilde blant</text>
<text x="1516" y="566" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#274246" text-anchor="start">mange. Institusjonen kan bli</text>
<text x="1516" y="589" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#274246" text-anchor="start">for treg og lukket.</text>
<circle cx="1485" cy="628" r="19" fill="#1e3a3f" stroke="#ffffff" stroke-width="3"/>
<text x="1485" y="636" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
<text x="1516" y="636" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#1e3a3f" text-anchor="start">Hvor er vi i dag?</text>
<text x="1516" y="663" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#274246" text-anchor="start">Plasseringen på skalaen nederst</text>
<text x="1516" y="686" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#274246" text-anchor="start">er bevisst tom. Den er</text>
<text x="1516" y="709" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#274246" text-anchor="start">diskusjonens startpunkt.</text>
<line x1="60" y1="1010" x2="1860" y2="1010" stroke="#cdd3d4" stroke-width="1"/>
<rect x="60" y="1026" width="26" height="24" rx="5" fill="#eff8fa" stroke="#274246" stroke-width="1.8"/>
<text x="96" y="1046" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#274246" text-anchor="start">Dataplattform</text>
<rect x="237.8" y="1028" width="26" height="20" rx="10" fill="#ecfeed" stroke="#00824d" stroke-width="1.5"/>
<text x="273.8" y="1046" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#274246" text-anchor="start">Statistikkfaglig institusjon</text>
<rect x="544.6" y="1026" width="26" height="24" rx="5" fill="#ffffff" stroke="#5e787a" stroke-width="1.6" stroke-dasharray="5 4"/>
<text x="580.6" y="1046" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#274246" text-anchor="start">Ikke plassert</text>
<text x="1860" y="1046" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#5e787a" text-anchor="end">29.09.2026 · Scenario til diskusjon, ikke vedtatt retning</text>
<rect x="320" y="186" width="535" height="66" rx="10" fill="#274246" stroke="#274246" stroke-width="0"/>
<text x="342" y="228" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="21" font-weight="700" fill="#ffffff" text-anchor="start">SSB som dataplattform</text>
<rect x="865" y="186" width="535" height="66" rx="10" fill="#00824d" stroke="#00824d" stroke-width="0"/>
<text x="887" y="228" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="21" font-weight="700" fill="#ffffff" text-anchor="start">SSB som autoritativ institusjon</text>
<rect x="60" y="266" width="250" height="82" rx="8" fill="#ffffff" stroke="#cdd3d4" stroke-width="1.2"/>
<text x="76" y="314" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#1e3a3f" text-anchor="start">Verdiløfte</text>
<rect x="320" y="266" width="535" height="82" rx="8" fill="#eff8fa" stroke="#274246" stroke-width="1.3"/>
<text x="340" y="314" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#1e3a3f" text-anchor="start">Mest mulig data, raskest mulig</text>
<rect x="865" y="266" width="535" height="82" rx="8" fill="#ecfeed" stroke="#00824d" stroke-width="1.3"/>
<text x="885" y="302" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#1e3a3f" text-anchor="start">Tall man kan stå inne for, med begreper og</text>
<text x="885" y="324" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#1e3a3f" text-anchor="start">forbehold</text>
<rect x="60" y="358" width="250" height="82" rx="8" fill="#ffffff" stroke="#cdd3d4" stroke-width="1.2"/>
<text x="76" y="406" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#1e3a3f" text-anchor="start">Hva brukeren får</text>
<rect x="320" y="358" width="535" height="82" rx="8" fill="#eff8fa" stroke="#274246" stroke-width="1.3"/>
<text x="340" y="406" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#1e3a3f" text-anchor="start">Datasett og API-er</text>
<rect x="865" y="358" width="535" height="82" rx="8" fill="#ecfeed" stroke="#00824d" stroke-width="1.3"/>
<text x="885" y="406" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#1e3a3f" text-anchor="start">Svar med definisjon, metode og usikkerhet</text>
<rect x="60" y="450" width="250" height="82" rx="8" fill="#ffffff" stroke="#cdd3d4" stroke-width="1.2"/>
<text x="76" y="498" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#1e3a3f" text-anchor="start">Kompetansesatsing</text>
<rect x="320" y="450" width="535" height="82" rx="8" fill="#eff8fa" stroke="#274246" stroke-width="1.3"/>
<text x="340" y="498" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#1e3a3f" text-anchor="start">Dataingeniører og plattform</text>
<rect x="865" y="450" width="535" height="82" rx="8" fill="#ecfeed" stroke="#00824d" stroke-width="1.3"/>
<text x="885" y="498" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#1e3a3f" text-anchor="start">Fagkunnskap gjort maskinlesbar</text>
<rect x="60" y="542" width="250" height="82" rx="8" fill="#ffffff" stroke="#cdd3d4" stroke-width="1.2"/>
<text x="76" y="590" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#1e3a3f" text-anchor="start">KIs rolle</text>
<rect x="320" y="542" width="535" height="82" rx="8" fill="#eff8fa" stroke="#274246" stroke-width="1.3"/>
<text x="340" y="590" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#1e3a3f" text-anchor="start">Konsumerer SSB-data</text>
<rect x="865" y="542" width="535" height="82" rx="8" fill="#ecfeed" stroke="#00824d" stroke-width="1.3"/>
<text x="885" y="590" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#1e3a3f" text-anchor="start">Bruker SSBs begreper og forbehold</text>
<rect x="60" y="634" width="250" height="82" rx="8" fill="#ffffff" stroke="#cdd3d4" stroke-width="1.2"/>
<text x="76" y="682" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#1e3a3f" text-anchor="start">Styrke</text>
<rect x="320" y="634" width="535" height="82" rx="8" fill="#eff8fa" stroke="#274246" stroke-width="1.3"/>
<text x="340" y="682" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#1e3a3f" text-anchor="start">Skala, fart, lav terskel</text>
<rect x="865" y="634" width="535" height="82" rx="8" fill="#ecfeed" stroke="#00824d" stroke-width="1.3"/>
<text x="885" y="682" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#1e3a3f" text-anchor="start">Tillit, sporbarhet, faglig særpreg</text>
<rect x="60" y="726" width="250" height="82" rx="8" fill="#ffffff" stroke="#cdd3d4" stroke-width="1.2"/>
<text x="76" y="774" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#1e3a3f" text-anchor="start">Risiko</text>
<rect x="320" y="726" width="535" height="82" rx="8" fill="#eff8fa" stroke="#274246" stroke-width="1.3"/>
<text x="340" y="774" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#1e3a3f" text-anchor="start">Blir én datakilde blant mange</text>
<rect x="865" y="726" width="535" height="82" rx="8" fill="#ecfeed" stroke="#00824d" stroke-width="1.3"/>
<text x="885" y="774" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#1e3a3f" text-anchor="start">Kan oppleves som tregt og lukket</text>
<text x="60" y="846" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#1e3a3f" text-anchor="start">Hvor ligger SSB i dag, og hvor peker valgene de neste tre årene?</text>
<line x1="320" y1="890" x2="1400" y2="890" stroke="#cdd3d4" stroke-width="8" stroke-linecap="round"/>
<text x="320" y="926" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#274246" text-anchor="start">dataplattform</text>
<text x="1400" y="926" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#00824d" text-anchor="end">autoritativ institusjon</text>
<circle cx="860.0" cy="890" r="18" fill="#ffffff" stroke="#5e787a" stroke-width="2" stroke-dasharray="4 3"/>
<text x="860.0" y="896" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#5e787a" text-anchor="middle">?</text>
<text x="860.0" y="932" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" fill="#5e787a" text-anchor="middle">ikke plassert</text>
</svg>
