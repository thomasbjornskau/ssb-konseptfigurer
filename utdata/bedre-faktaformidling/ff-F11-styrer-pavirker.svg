<text x="520" y="232" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#5e787a" text-anchor="middle">STYRER IKKE</text>
<text x="520" y="355" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#4b2fb0" text-anchor="middle">PÅVIRKER</text>
<text x="520" y="482" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#274246" text-anchor="middle">STYRER</text>
