<rect x="968" y="184" width="432" height="236" rx="12" fill="#f1f1fe" stroke="#7d5fea" stroke-width="2"/>
<circle cx="1008" cy="214.4" r="12.0" fill="#7d5fea"/>
<path d="M986.4,254.4 C986.4,230.4 995.2,228.8 1008,228.8 C1020.8,228.8 1029.6,230.4 1029.6,254.4 Z" fill="#7d5fea"/>
<text x="1048" y="232" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#4b2fb0" text-anchor="start">Brukeren ønsker</text>
<text x="994" y="284" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#1e3a3f" text-anchor="start">·  et raskt svar</text>
<text x="994" y="316" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#1e3a3f" text-anchor="start">·  å kunne stole på svaret</text>
<text x="994" y="348" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#1e3a3f" text-anchor="start">·  å forstå hva tallet betyr</text>
<text x="994" y="380" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#1e3a3f" text-anchor="start">·  å finne veien videre</text>
<rect x="968" y="446" width="432" height="290" rx="12" fill="#ffffff" stroke="#7d5fea" stroke-width="2" stroke-dasharray="7 5"/>
<text x="990" y="482" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#1e3a3f" text-anchor="start">Det som virker utover</text>
<text x="990" y="508" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#5e787a" text-anchor="start">tiltak innerst, foreslått</text>
<rect x="990" y="528" width="388" height="38" rx="8" fill="#ecfeed" stroke="#00824d" stroke-width="1.3"/>
<text x="1004" y="553" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#00824d" text-anchor="start">Maskinlesbare begreper og forbehold</text>
<rect x="990" y="578" width="388" height="38" rx="8" fill="#ecfeed" stroke="#00824d" stroke-width="1.3"/>
<text x="1004" y="603" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#00824d" text-anchor="start">Stabile lenker og siterbare tall</text>
<rect x="990" y="628" width="388" height="38" rx="8" fill="#ecfeed" stroke="#00824d" stroke-width="1.3"/>
<text x="1004" y="653" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#00824d" text-anchor="start">API-er som leverer metadata med tallene</text>
<rect x="990" y="678" width="388" height="38" rx="8" fill="#ecfeed" stroke="#00824d" stroke-width="1.3"/>
<text x="1004" y="703" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#00824d" text-anchor="start">Tydelig lisens for maskinell bruk</text>
<polyline points="670.0,598.0 953.6,598.0" fill="none" stroke="#7d5fea" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="8 5"/>
<polygon points="964.0,598.0 944.5,607.1 944.5,588.9" fill="#7d5fea"/>
<rect x="836" y="554" width="108" height="26" rx="13" fill="#ffffff" stroke="#7d5fea" stroke-width="1.3"/>
<text x="890" y="572" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#4b2fb0" text-anchor="middle">virker utover</text>
<rect x="968" y="762" width="432" height="222" rx="12" fill="#ffffff" stroke="#5e787a" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="990" y="798" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#1e3a3f" text-anchor="start">Uavklart</text>
<text x="990" y="828" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#274246" text-anchor="start">Hvor mye kan SSB påvirke KI-leverandører</text>
<text x="990" y="852" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#274246" text-anchor="start">i praksis?</text>
<text x="990" y="876" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#274246" text-anchor="start">Hva gjør vi når et KI-verktøy gjengir</text>
<text x="990" y="900" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#274246" text-anchor="start">et SSB-tall feil?</text>
<text x="990" y="924" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#274246" text-anchor="start">Er lisensen tilpasset maskinell bruk?</text>
