<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
<rect x="0" y="0" width="1920" height="1080" fill="#ffffff"/>
<text x="60" y="92" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="46" font-weight="700" fill="#1e3a3f" text-anchor="start">Hva SSB styrer, påvirker og ikke styrer</text>
<text x="60" y="136" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="24" font-weight="400" fill="#5e787a" text-anchor="start">Hvor vi har kontroll, hvor vi kan påvirke, og hva andre gjør uansett</text>
<rect x="1690" y="62" width="170" height="40" rx="20" fill="#ffffff" stroke="#274246" stroke-width="2"/>
<text x="1775.0" y="89" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#274246" text-anchor="middle">Oversikt</text>
<line x1="60" y1="160" x2="1860" y2="160" stroke="#cdd3d4" stroke-width="2"/>
<rect x="1440" y="180" width="420" height="806" rx="16" fill="#eff8fa" stroke="#eff8fa" stroke-width="0"/>
<text x="1466" y="226" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="25" font-weight="700" fill="#1e3a3f" text-anchor="start">Slik leses figuren</text>
<circle cx="1485" cy="268" r="19" fill="#1e3a3f" stroke="#ffffff" stroke-width="3"/>
<text x="1485" y="276" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
<text x="1516" y="276" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#1e3a3f" text-anchor="start">Tre sirkler</text>
<text x="1516" y="303" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#274246" text-anchor="start">Innerst det SSB bestemmer selv.</text>
<text x="1516" y="326" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#274246" text-anchor="start">Så det vi kan påvirke. Ytterst</text>
<text x="1516" y="349" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#274246" text-anchor="start">det andre avgjør.</text>
<circle cx="1485" cy="388" r="19" fill="#1e3a3f" stroke="#ffffff" stroke-width="3"/>
<text x="1485" y="396" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
<text x="1516" y="396" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#1e3a3f" text-anchor="start">KI-svarene styrer vi ikke</text>
<text x="1516" y="423" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#274246" text-anchor="start">Generelle KI-verktøy velger selv</text>
<text x="1516" y="446" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#274246" text-anchor="start">kilder og formuleringer.</text>
<circle cx="1485" cy="485" r="19" fill="#1e3a3f" stroke="#ffffff" stroke-width="3"/>
<text x="1485" y="493" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
<text x="1516" y="493" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#1e3a3f" text-anchor="start">Det innerste virker utover</text>
<text x="1516" y="520" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#274246" text-anchor="start">Maskinlesbare begreper, forbehold</text>
<text x="1516" y="543" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#274246" text-anchor="start">og siterbare tall gjør gode svar</text>
<text x="1516" y="566" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#274246" text-anchor="start">enklest å gi, også for andre.</text>
<circle cx="1485" cy="605" r="19" fill="#1e3a3f" stroke="#ffffff" stroke-width="3"/>
<text x="1485" y="613" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
<text x="1516" y="613" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#1e3a3f" text-anchor="start">Brukerens behov er likt</text>
<text x="1516" y="640" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#274246" text-anchor="start">Brukeren vil ha et raskt svar</text>
<text x="1516" y="663" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#274246" text-anchor="start">å stole på, uansett hvor</text>
<text x="1516" y="686" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#274246" text-anchor="start">spørsmålet stilles.</text>
<line x1="60" y1="1010" x2="1860" y2="1010" stroke="#cdd3d4" stroke-width="1"/>
<rect x="60" y="1026" width="26" height="24" rx="5" fill="#eff8fa" stroke="#274246" stroke-width="1.8"/>
<text x="96" y="1046" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#274246" text-anchor="start">Styrer</text>
<rect x="177.6" y="1026" width="26" height="24" rx="5" fill="#f1f1fe" stroke="#7d5fea" stroke-width="1.8"/>
<text x="213.6" y="1046" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#274246" text-anchor="start">Påvirker</text>
<rect x="312.4" y="1026" width="26" height="24" rx="5" fill="#f3f5f5" stroke="#b9c5c6" stroke-width="1.6"/>
<text x="348.4" y="1046" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#274246" text-anchor="start">Styrer ikke</text>
<rect x="473.0" y="1026" width="26" height="24" rx="5" fill="#ffffff" stroke="#7d5fea" stroke-width="2" stroke-dasharray="6 4"/>
<text x="509.0" y="1046" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#274246" text-anchor="start">Foreslåtte tiltak</text>
<rect x="685.2" y="1026" width="26" height="24" rx="5" fill="#ffffff" stroke="#5e787a" stroke-width="1.6" stroke-dasharray="5 4"/>
<text x="721.2" y="1046" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#274246" text-anchor="start">Uavklart</text>
<text x="1860" y="1046" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#5e787a" text-anchor="end">29.09.2026 · Utkast til diskusjon, ikke kvalitetssikret</text>
<circle cx="520" cy="598" r="400" fill="#f3f5f5" stroke="#b9c5c6" stroke-width="2"/>
<circle cx="520" cy="598" r="275" fill="#f1f1fe" stroke="#7d5fea" stroke-width="2"/>
